# -----------------------------------------------------------------------------
# Production stack for the Hostinger VPS.
#
# Sized to stay inside a ~2 GB slice of an 8 GB box that already hosts two other
# projects. Every service has a hard memory ceiling so a leak or a traffic spike
# here can never starve the neighbours — Docker OOM-kills the offending
# container instead of letting the kernel pick a victim at random.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Profiles
#   (default)  api only — binds 127.0.0.1 for the host's EXISTING nginx. This is
#              the profile this VPS uses: nginx already owns 80/443.
#   edge       api + caddy. NOT used here; kept for a host with no proxy yet.
#   sandbox    adds Piston for coding questions. Read the memory note first.
#
# Memory ceilings (sum of limits, not typical usage):
#   api 1024M + caddy 96M                    = 1.1 GB   <- recommended
#   api  768M + caddy 96M + piston 768M      = 1.6 GB   <- with sandbox, tight
# -----------------------------------------------------------------------------

name: careerplatform

services:
  api:
    build:
      # Path to the backend package (the directory holding its Dockerfile, src/ and
      # schema.sql), relative to this compose file.
      #
      # Configurable because the two supported layouts differ:
      #   monorepo         -> BUILD_CONTEXT=./backend
      #   backend-only repo -> BUILD_CONTEXT=.        (compose file sits beside the Dockerfile)
      #
      # A wrong value fails fast and unmistakably with
      # "unable to prepare context: path ... not found".
      context: ${BUILD_CONTEXT:-.}
      dockerfile: Dockerfile
    image: careerplatform-api:latest
    restart: unless-stopped

    # Published on loopback only. The internet reaches this through the host's
    # nginx, so the container is never directly exposed and the port cannot
    # collide with the other projects' public listeners.
    #
    # Default is 8081, not 8080: on this VPS 8080 is already held by another
    # project's Java process.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8081}:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # ── Memory containment ──────────────────────────────────────────────────
      # The ASP.NET Web SDK turns on Server GC by default, which reserves a
      # separate heap per logical core. On this 8-core VPS that is the single
      # largest source of idle RSS. Workstation GC uses one heap and cuts the
      # baseline by roughly half at a small throughput cost that is irrelevant at
      # this traffic level.
      DOTNET_gcServer: "0"
      # Trades CPU for a smaller footprint (0 = off, 9 = most aggressive).
      DOTNET_GCConserveMemory: "5"
      # .NET reads the cgroup limit below and caps its heap at 75% of it, so the
      # runtime backs off before Docker has to kill anything.
      DOTNET_GCHeapHardLimitPercent: "50"

      # ── Database (Supabase Postgres) ────────────────────────────────────────
      # Npgsql keyword form rather than a URI: the password goes in verbatim, so
      # characters like @ : / ? # cannot corrupt the parse.
      #
      # Max Pool Size is deliberately modest — Supabase caps concurrent pooler
      # connections, and every pooled connection costs memory on both ends.
      ConnectionStrings__DefaultConnection: >-
        Host=${SUPABASE_HOST};Port=${SUPABASE_PORT:-5432};Database=${SUPABASE_DB:-postgres};Username=${SUPABASE_USER};Password=${SUPABASE_PASSWORD};SSL Mode=Require;Trust Server Certificate=${DATABASE_TRUST_SERVER_CERTIFICATE:-false};Pooling=true;Minimum Pool Size=0;Maximum Pool Size=${DB_MAX_POOL_SIZE:-15};Connection Idle Lifetime=60;Search Path=${DATABASE_SCHEMA:-public}
      ConnectionStrings__Redis: disabled

      # ── Auth ────────────────────────────────────────────────────────────────
      # This API mints its own tokens (Infrastructure/Security/JwtIssuer.cs), so
      # the issuer is THIS service, not Supabase. Supabase is only Postgres here.
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE:-authenticated}
      Jwt__Secret: ${JWT_SECRET}

      # Vercel and this API are different sites, so the session cookie must be
      # SameSite=None + Secure or the browser silently drops it on every
      # cross-site request: login appears to work, then everything 401s.
      AuthCookie__SameSite: ${AUTH_COOKIE_SAMESITE:-None}
      AuthCookie__AlwaysSecure: ${AUTH_COOKIE_ALWAYS_SECURE:-true}
      AuthCookie__Partitioned: ${AUTH_COOKIE_PARTITIONED:-false}

      # ── CORS ────────────────────────────────────────────────────────────────
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
      Cors__AllowedOrigins__1: ${FRONTEND_ORIGIN_PREVIEW:-}
      # Vercel gives every preview deployment its own hostname, so exact origins
      # cannot cover them. Match on a team-scoped host suffix instead.
      Cors__AllowedOriginSuffixes__0: ${FRONTEND_PREVIEW_SUFFIX:-}

      # ── Payments ────────────────────────────────────────────────────────────
      Razorpay__KeyId: ${RAZORPAY_KEY_ID}
      Razorpay__KeySecret: ${RAZORPAY_KEY_SECRET}

      # ── Email (Brevo) ───────────────────────────────────────────────────────
      Brevo__ApiKey: ${BREVO_API_KEY}
      Brevo__SenderEmail: ${BREVO_SENDER_EMAIL}
      Brevo__SenderName: ${BREVO_SENDER_NAME:-CareerPlatform}
      Brevo__OtpTemplateId: ${BREVO_OTP_TEMPLATE_ID:-}
      Otp__HashKey: ${OTP_HASH_KEY}

      # ── Code execution ──────────────────────────────────────────────────────
      # Defaults to Disabled so the base stack stays inside its memory budget.
      # MCQ assessments work normally; the runner hides the Run button and coding
      # questions score 0 with the gap shown on the scorecard.
      CodeExecution__Provider: ${CODE_EXECUTION_PROVIDER:-Disabled}
      CodeExecution__BaseUrl: ${CODE_EXECUTION_BASE_URL:-}

      # ── Observability ───────────────────────────────────────────────────────
      # Both OFF by default: there is no OTLP collector on this VPS, and running one
      # would cost 100-300 MB out of the 2 GB budget. Startup HARD-FAILS if either
      # flag is true while the endpoint is empty (ValidateExporterEndpoint), so these
      # three values must always be changed together.
      Observability__TracingEnabled: ${OBSERVABILITY_TRACING_ENABLED:-false}
      Observability__MetricsEnabled: ${OBSERVABILITY_METRICS_ENABLED:-false}
      Observability__OtlpEndpoint: ${OBSERVABILITY_OTLP_ENDPOINT:-}

      # ── File storage ────────────────────────────────────────────────────────
      # Uploaded resumes land on local disk (LocalFileStorage). Its default root is
      # AppContext.BaseDirectory/storage — i.e. /app/storage INSIDE the container,
      # which is ephemeral: every rebuild or `up --force-recreate` would silently
      # discard every uploaded file. Pinned to an explicit path backed by the named
      # volume below so uploads survive redeploys.
      Storage__Provider: ${STORAGE_PROVIDER:-Local}
      Storage__LocalPath: /app/storage

    volumes:
      - api_storage:/app/storage

    # Places the container inside the 2 GB systemd slice
    # (deploy/systemd/careerplatform.slice). The slice caps this project as a
    # GROUP; the per-container limits below decide which container dies first if
    # that cap is reached.
    cgroup_parent: ${CGROUP_PARENT:-careerplatform.slice}

    mem_limit: ${API_MEM_LIMIT:-1024m}
    mem_reservation: 256m
    # Without this, a container hitting its memory ceiling can swap-thrash the
    # whole host instead of failing fast.
    memswap_limit: ${API_MEM_LIMIT:-1024m}
    cpus: ${API_CPUS:-1.5}

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

    logging: &default_logging
      driver: json-file
      options:
        # Unbounded container logs are a slow disk leak. Cap and rotate.
        max-size: "10m"
        max-file: "3"

    networks:
      - careerplatform

  # ---------------------------------------------------------------------------
  # TLS terminator. Only start this if nothing else on the VPS owns 80/443:
  #   docker compose -f docker-compose.prod.yml --profile edge up -d
  # Caddy obtains and renews Let's Encrypt certificates automatically, which the
  # Secure cookie above depends on — over plain HTTP the browser will not send it.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["edge"]
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cgroup_parent: ${CGROUP_PARENT:-careerplatform.slice}
    mem_limit: 96m
    mem_reservation: 32m
    logging: *default_logging
    networks:
      - careerplatform

  # ---------------------------------------------------------------------------
  # Code-execution sandbox. OPT-IN:
  #   docker compose -f docker-compose.prod.yml --profile sandbox up -d
  #
  # Memory warning: Piston spawns a fresh runtime per submission. Python and Node
  # fit the 768M ceiling; a JVM run does not reliably, so install only the light
  # runtimes (step 9 of the guide) and drop java/cpp from application.properties.
  # If you need the full language matrix, run Piston on a different host and point
  # CODE_EXECUTION_BASE_URL at it instead.
  # ---------------------------------------------------------------------------
  piston:
    image: ghcr.io/engineer-man/piston:latest
    restart: unless-stopped
    profiles: ["sandbox"]
    # Piston isolates untrusted code with its own namespaces, which needs
    # elevated privileges. It is reachable only from the internal compose
    # network — never publish this port.
    privileged: true
    tmpfs:
      - /tmp:exec,size=256M
    volumes:
      - piston_packages:/piston/packages
    cgroup_parent: ${CGROUP_PARENT:-careerplatform.slice}
    mem_limit: ${PISTON_MEM_LIMIT:-768m}
    memswap_limit: ${PISTON_MEM_LIMIT:-768m}
    cpus: ${PISTON_CPUS:-1.0}
    logging: *default_logging
    networks:
      - careerplatform

networks:
  careerplatform:
    driver: bridge

volumes:
  # Uploaded resumes/PDFs. Back this up — it is the only state not in Supabase.
  api_storage:
  caddy_data:
  caddy_config:
  piston_packages:
