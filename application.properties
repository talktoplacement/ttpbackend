# =============================================================================
#  TalktoPlacement — operator-owned runtime settings
# =============================================================================
#  This file is the SOURCE OF TRUTH for subscription pricing.
#
#  To change what a student is charged, edit the `price` line for that plan and
#  save. No code change and no redeploy are required:
#
#    1. The file is watched (reloadOnChange), so the running API picks up the
#       edit within a second.
#    2. The catalog reconciler mirrors these values into the SubscriptionPlans
#       table, matching each entry by its plan code.
#    3. Razorpay orders are always priced from the stored plan, so the very next
#       checkout charges the new amount.
#
#  Keys map onto configuration sections by replacing '.' with ':' — so
#  `pricing.plans.monthly-pro.price` binds to PricingOptions.Plans["monthly-pro"].Price.
#
#  Precedence: appsettings.json < application.properties < .env < real env vars.
#  A value set as a real environment variable therefore always wins, which is how
#  you override a single price in one environment without editing this file.
# =============================================================================

# --- Pricing engine -----------------------------------------------------------
# Set to false to freeze the database catalog and manage plans purely through the
# admin UI instead of this file.
pricing.reconcileFromConfig=true

# Currency used for any plan that does not override it. ISO-4217, 3 letters.
pricing.defaultCurrency=INR

# --- Plans --------------------------------------------------------------------
#  The key segment after `pricing.plans.` is the plan CODE. It is the stable
#  identifier: never change it once customers have subscribed (rename `name`
#  instead). Adding a brand-new tier here is all that is needed for it to appear
#  in the catalog API, the pricing page, and checkout.
#
#  price         : whole currency units (rupees for INR). 0 is allowed.
#  intervalUnit  : Day | Week | Month | Year
#  intervalCount : number of intervalUnit per billing period (3 = quarterly)
#  active        : false retires a tier without deleting it or breaking history
#  displayOrder  : ascending sort on customer-facing surfaces

pricing.plans.monthly-pro.name=Monthly Plan
pricing.plans.monthly-pro.description=Complete acceleration for students preparing for campus or off-campus technical drives this month.
pricing.plans.monthly-pro.price=199
pricing.plans.monthly-pro.intervalUnit=Month
pricing.plans.monthly-pro.intervalCount=1
pricing.plans.monthly-pro.active=true
pricing.plans.monthly-pro.displayOrder=1

pricing.plans.quarterly-pro.name=3 Months Plan
pricing.plans.quarterly-pro.description=Quarterly sprint covering deep DSA patterns, system design, and six mock technical interview rounds.
pricing.plans.quarterly-pro.price=499
pricing.plans.quarterly-pro.intervalUnit=Month
pricing.plans.quarterly-pro.intervalCount=3
pricing.plans.quarterly-pro.active=true
pricing.plans.quarterly-pro.displayOrder=2

pricing.plans.half-yearly-pro.name=6 Months Plan
pricing.plans.half-yearly-pro.description=Half-yearly intensive campus placement accelerator with dedicated senior mentor guidance.
pricing.plans.half-yearly-pro.price=999
pricing.plans.half-yearly-pro.intervalUnit=Month
pricing.plans.half-yearly-pro.intervalCount=6
pricing.plans.half-yearly-pro.active=true
pricing.plans.half-yearly-pro.displayOrder=3

pricing.plans.yearly-premium.name=Yearly Plan
pricing.plans.yearly-premium.description=The ultimate career accelerator for tier-1 roles with continuous personalised guidance.
pricing.plans.yearly-premium.price=1999
pricing.plans.yearly-premium.intervalUnit=Month
pricing.plans.yearly-premium.intervalCount=12
pricing.plans.yearly-premium.active=true
pricing.plans.yearly-premium.displayOrder=4

# --- Code execution sandbox ---------------------------------------------------
#  Powers the "Run" button and the grading of coding questions in assessments.
#
#  provider = Disabled : no sandbox. MCQ questions still work and are graded
#                        normally; the runner hides the Run action and coding
#                        questions score 0 with the gap shown on the scorecard.
#  provider = Piston   : self-hosted Piston instance (https://github.com/engineer-man/piston).
#                        Point baseUrl at YOUR OWN deployment — the public demo
#                        endpoint is rate-limited and must not be used in prod.
#  The compose files in the repository root bring up a Piston container reachable at
#  http://localhost:2000 in local development and http://piston:2000 inside the production
#  compose network. Set provider=Disabled to turn coding questions off without removing anything.
codeExecution.provider=Piston
codeExecution.baseUrl=http://localhost:2000
codeExecution.requestTimeoutSeconds=20

# Hard ceiling on any single run, regardless of a question's own timeLimitMs.
codeExecution.maxTimeLimitMs=10000

# Largest submission accepted, in characters.
codeExecution.maxSourceCodeLength=64000

# Largest stdin payload accepted for an ad-hoc run from the code viewer.
codeExecution.maxStdinLength=10000

# Time budget for an ad-hoc "Run" in the docs code viewer. Assessment questions
# carry their own per-question limit; this is the fallback for snippets that have
# none. Still clamped by maxTimeLimitMs above.
codeExecution.scratchpadTimeLimitMs=5000

# Sandbox budget per USER. Each permitted run starts a sandbox process, so this
# bounds compute rather than plain request volume — lower it if the box is small.
codeExecution.runsPerWindow=20
codeExecution.runWindowSeconds=60

#  Languages offered to students.
#
#  Format: id|label|runtimeVersion             (runtime name == id)
#          id|label|runtimeVersion|runtimeName (runtime name differs from id)
#
#  id          : stored on the student's answer row and sent by the browser. Keep it
#                URL/JSON-safe and NEVER change it once answers exist.
#  label       : what the student sees in the language dropdown.
#  runtimeVer  : must exist on your Piston instance — check `GET /api/v2/runtimes`.
#  runtimeName : Piston's own language name, when it differs from the id.
#
#  Add or remove a line to change the dropdown; no code change or redeploy needed.
#  Each language must also be installed in the Piston container (see the
#  `piston-init` service in docker-compose.yml / docker-compose.prod.yml).
codeExecution.languages.0=python|Python 3|3.10.0
codeExecution.languages.1=javascript|JavaScript (Node 18)|18.15.0
codeExecution.languages.2=java|Java 15|15.0.2
codeExecution.languages.3=cpp|C++ 17|10.2.0|c++
