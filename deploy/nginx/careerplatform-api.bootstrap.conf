# -----------------------------------------------------------------------------
# PHASE 1 of 2 — HTTP-only vhost used solely to obtain the first certificate.
#
# Why this file exists:
#   careerplatform-api.conf (phase 2) declares ssl_certificate paths under
#   /etc/letsencrypt/live/<host>/. Those files do not exist until certbot has run,
#   so nginx refuses to start:
#       [emerg] cannot load certificate "/etc/letsencrypt/live/.../fullchain.pem"
#   and certbot cannot complete its HTTP-01 challenge because nginx is down. This
#   file breaks that deadlock by serving plain HTTP and nothing else.
#
# Usage (replace HOSTNAME first):
#   sudo cp careerplatform-api.bootstrap.conf /etc/nginx/sites-available/careerplatform-api
#   sudo ln -sf /etc/nginx/sites-available/careerplatform-api /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/html
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/html -d HOSTNAME
#
# Then swap in phase 2 (careerplatform-api.conf), which adds TLS, HSTS, the
# security headers and the HTTP->HTTPS redirect:
#   sudo cp careerplatform-api.conf /etc/nginx/sites-available/careerplatform-api
#   sudo nginx -t && sudo systemctl reload nginx
#
# `certonly --webroot` is used rather than `--nginx` deliberately: it does not
# rewrite this file, so phase 2 stays exactly as version-controlled.
# -----------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name api.your-domain.com;

    # The only path that must work in this phase. certbot writes its challenge
    # token here and Let's Encrypt fetches it over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else is intentionally refused while bootstrapping: the session
    # cookie is Secure, so serving the API over plain HTTP would produce a
    # half-working login rather than an obvious failure.
    location / {
        return 503 "TLS setup in progress\n";
        add_header Content-Type text/plain always;
    }
}
