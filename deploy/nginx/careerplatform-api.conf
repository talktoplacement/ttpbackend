# -----------------------------------------------------------------------------
# nginx vhost for the CareerPlatform API.
#
# This VPS already runs nginx on 80/443 for two other projects, so the API is
# added as another server block rather than starting a second TLS terminator.
# The container listens on 127.0.0.1:8081 only and is never exposed directly.
#
# Install:
#   sudo cp careerplatform-api.conf /etc/nginx/sites-available/careerplatform-api
#   sudo ln -s /etc/nginx/sites-available/careerplatform-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the certificate (certbot rewrites the ssl_* lines below):
#   sudo certbot --nginx -d api.your-domain.com
#
# Replace api.your-domain.com throughout before installing.
# -----------------------------------------------------------------------------

upstream careerplatform_api {
    # Must match API_HOST_PORT in .env.prod. 8080 is taken by another project's
    # Java process on this box, hence 8081.
    server 127.0.0.1:8081;

    # Reuse connections to the container instead of a fresh TCP handshake per
    # request. Requires the HTTP/1.1 + empty-Connection headers set below.
    keepalive 16;
}

# ── HTTP: redirect everything to HTTPS ───────────────────────────────────────
# The session cookie is issued Secure (it must be, because it is also
# SameSite=None for the Vercel frontend), so plain HTTP can never carry a
# logged-in session. Redirect rather than serve.
server {
    listen 80;
    listen [::]:80;
    server_name api.your-domain.com;

    # Leave ACME reachable over HTTP so certbot renewals succeed.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.your-domain.com;

    # certbot --nginx fills these in. Placeholders kept so `nginx -t` fails loudly
    # rather than silently serving the wrong certificate.
    ssl_certificate     /etc/letsencrypt/live/api.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL_cpapi:5m;
    ssl_session_timeout 1h;

    # Kestrel rejects bodies over 10 MB (RequestLimits:MaxBodyBytes). nginx
    # defaults to just 1 MB, which would 413 resume and PDF uploads before the
    # app ever sees them. Slightly above the app limit so the API — not the proxy
    # — produces the error, giving a JSON response the frontend can parse.
    client_max_body_size 12m;
    client_body_timeout  60s;

    # Logs are per-vhost so this project's traffic does not pollute the other two.
    access_log /var/log/nginx/careerplatform-api.access.log;
    error_log  /var/log/nginx/careerplatform-api.error.log warn;

    # Security headers. Deliberately NO Access-Control-* headers here: the API
    # owns CORS (it must, because it echoes a credentialed origin). Adding them
    # at the proxy too would emit duplicates and every browser would reject the
    # response.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Readiness reports dependency state (Postgres). Useful to you on the box,
    # not something to publish. Liveness stays open for uptime monitoring.
    location = /health/ready {
        return 404;
    }

    location / {
        proxy_pass http://careerplatform_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # X-Forwarded-Proto is load-bearing, not decorative: the app reads it via
        # ForwardedHeaders to know the original request was HTTPS. Without it the
        # API sees a plain-HTTP hop and will not attach the Secure session cookie,
        # so login silently fails to persist.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Host              $host;

        # Let the app's own rate limiter and error handling do the talking.
        proxy_intercept_errors off;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # Comfortably above the app's own 20s code-execution timeout so nginx is
        # never the component that cuts a slow request short.
        proxy_read_timeout    60s;

        # Stream responses straight through; the payloads here are small JSON or
        # file downloads that gain nothing from proxy buffering.
        proxy_buffering off;
    }
}
